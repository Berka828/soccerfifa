<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>World Cup Keep-Up</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { transform: scaleX(-1); display: none; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 16, 48, 0.9); z-index: 100; color: #fff; text-align: center;
        }
        button {
            padding: 20px 50px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
            background-color: #4CAF50; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0, 0.5); transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; transform: scale(1.05); }
        
        .dg.ac { z-index: 50 !important; transition: opacity 0.3s; }
        body.fullscreen .dg.ac { opacity: 0; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 2px; font-size: 3em; font-weight: bold; margin-bottom: 10px;">WORLD CUP KEEP-UP</h1>
        <p style="color: #ddd; font-size: 1.2em; margin-bottom: 40px;">Juggle to build power, then kick it FORWARD into the net!</p>
        <button onclick="startApp()">START GAME</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        var video = document.getElementById('webcam');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        var soccerBall = null, motionPoints = [], lastFrame = null, ballTrail = [];
        var engineBooted = false, score = 0, highScore = 0;
        
        var backgroundImage = new Image();
        var backgroundLoaded = false;
        var goalCelebration = { text: '', life: 0 };

        var settings = {
            gameSpeed: 1.0, kickPower: 18, ballSize: 60, gravity: 0.45,
            floorLevel: 0.85, cameraAlpha: 0.25, cameraBlur: 4,
            indicatorColor: '#FFFF00', indicatorSize: 50,
        };

        var audioCtx;

        function startApp() {
            document.getElementById('ui').style.display = 'none';
            initAudio();

            backgroundImage.src = 'ChatGPT Image May 16, 2026, 04_06_46 AM.png';
            backgroundImage.onload = () => { backgroundLoaded = true; startCamera(); };
            backgroundImage.onerror = () => { alert("Background image not found. Please ensure it's in the same folder."); };
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
                video.play().catch(()=>{});
                var checkInterval = setInterval(() => {
                    if (video.videoWidth > 0 && !engineBooted) {
                        clearInterval(checkInterval);
                        engineBooted = true;
                        setupGUI();
                        startExperience();
                    }
                }, 100);
            }).catch(err => { console.error("Camera Error:", err); });
        }
        
        function setupGUI() {
            var gui = new dat.GUI();
            var gameFolder = gui.addFolder('Game Settings');
            gameFolder.add(settings, 'gameSpeed', 0.5, 2.0).name('Game Speed');
            gameFolder.add(settings, 'kickPower', 10, 30).name('Kick Power');
            gameFolder.add(settings, 'ballSize', 30, 100).name('Ball Size').onFinishChange(() => { if(soccerBall) soccerBall.radius = settings.ballSize; });
            gameFolder.add(settings, 'floorLevel', 0.5, 1.0).name('Floor Level');
            gameFolder.open();

            var playerFolder = gui.addFolder('Player & Effects');
            playerFolder.add(settings, 'cameraAlpha', 0.0, 0.7).name('Player Visibility');
            playerFolder.add(settings, 'cameraBlur', 0, 20).name('Player Blur');
            playerFolder.addColor(settings, 'indicatorColor').name('Touch Point Color');
            playerFolder.add(settings, 'indicatorSize', 10, 80).name('Touch Point Size');
            playerFolder.open();
        }

        function startExperience() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            soccerBall = createSoccerBall();
            trackMotion();
            gameLoop();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (backgroundLoaded) {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#114411'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            drawMirroredCamera();
            drawTouchIndicators();
            drawGoalTarget(); // Shows when shot is ready
            
            if (soccerBall) updateAndDrawBall();

            drawBroadcastUI(); 
            drawGoalCelebration(); 
        }

        function drawGoalTarget() {
            // If combo is high enough, show kids where to aim!
            if (score >= 3 && soccerBall && soccerBall.state === 'juggling') {
                var floorY = canvas.height * settings.floorLevel;
                var goalRect = { x: canvas.width * 0.35, y: floorY - canvas.height*0.35, width: canvas.width * 0.3, height: canvas.height*0.35 };
                
                ctx.save();
                ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + Math.sin(Date.now() / 150) * 0.3})`; // Pulsing gold
                ctx.lineWidth = 4;
                ctx.setLineDash([15, 15]);
                ctx.strokeRect(goalRect.x, goalRect.y, goalRect.width, goalRect.height);
                
                ctx.fillStyle = '#FFD700';
                ctx.textAlign = 'center';
                ctx.font = 'bold 24px Arial';
                ctx.fillText("POWER STRIKE READY!", canvas.width / 2, goalRect.y - 20);
                ctx.restore();
            }
        }

        function drawBroadcastUI() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 20, 50, 0.8)';
            ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(320, 20); ctx.lineTo(300, 80); ctx.lineTo(20, 80); ctx.closePath(); ctx.fill();
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath(); ctx.moveTo(canvas.width - 20, 20); ctx.lineTo(canvas.width - 280, 20); ctx.lineTo(canvas.width - 260, 60); ctx.lineTo(canvas.width - 20, 60); ctx.closePath(); ctx.fill();

            ctx.fillStyle = 'white'; ctx.font = 'bold 36px Arial, sans-serif'; ctx.textAlign = 'left';
            ctx.fillText(score, 40, 65);
            
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial, sans-serif';
            ctx.fillText('COMBO', 100, 62);
            
            ctx.fillStyle = 'white'; ctx.textAlign = 'right'; ctx.font = '20px Arial, sans-serif';
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 48);
            ctx.restore();
        }

        function triggerGoalCelebration() {
            goalCelebration.text = 'GOAL!';
            goalCelebration.life = 120; 
            playSound('cheer');
            score += 100; // Massive bonus
            if (score > highScore) highScore = score;
        }
        
        function drawGoalCelebration() {
            if (goalCelebration.life > 0) {
                goalCelebration.life--;
                ctx.save();
                let scale = 1 + (120 - goalCelebration.life) / 120;
                let alpha = goalCelebration.life > 60 ? 1 : goalCelebration.life / 60;
                
                ctx.textAlign = 'center';
                ctx.font = `bold ${100 * scale}px Arial, sans-serif`;
                ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.lineWidth = 8;
                
                ctx.strokeText(goalCelebration.text, canvas.width / 2, canvas.height / 2);
                ctx.fillText(goalCelebration.text, canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }
        }
        
        function updateAndDrawBall() {
            var floorY = canvas.height * settings.floorLevel;
            var goalRect = { x: canvas.width * 0.35, y: floorY - canvas.height*0.35, width: canvas.width * 0.3, height: canvas.height*0.35 };

            if (soccerBall.state === 'juggling') {
                soccerBall.vy += settings.gravity * settings.gameSpeed;
                soccerBall.x += soccerBall.vx * settings.gameSpeed;
                soccerBall.y += soccerBall.vy * settings.gameSpeed;
                soccerBall.vx *= 0.985; soccerBall.vy *= 0.985;
                soccerBall.rotation += soccerBall.vx * 0.02 * settings.gameSpeed;
                
                if (score >= 3) {
                    ballTrail.push({x: soccerBall.x, y: soccerBall.y, life: 20 + score, scale: 1});
                }

                if (soccerBall.x - settings.ballSize < 0 || soccerBall.x + settings.ballSize > canvas.width) {
                    soccerBall.vx *= -0.9; playSound('bounce');
                }

                // Dropped the ball while juggling
                if (soccerBall.y + settings.ballSize > floorY) {
                    soccerBall.y = floorY - settings.ballSize; soccerBall.vy *= -0.7;
                    if (score > 0) playSound('whistle');
                    score = 0; ballTrail = []; 
                }
            } 
            else if (soccerBall.state === 'shooting') {
                // THE 3D SHOT MECHANIC
                soccerBall.z += 0.025 * settings.gameSpeed; // Pushes ball into the background
                soccerBall.y += soccerBall.vy * settings.gameSpeed;
                soccerBall.x += soccerBall.vx * settings.gameSpeed;
                soccerBall.rotation += 0.15; // Fast spin

                ballTrail.push({x: soccerBall.x, y: soccerBall.y, life: 20, scale: Math.max(0.2, 1.0 - soccerBall.z)});

                // Once ball is deep in the background, check if it hit the net
                if (soccerBall.z >= 1.0) {
                    if (soccerBall.x > goalRect.x && soccerBall.x < goalRect.x + goalRect.width &&
                        soccerBall.y > goalRect.y && soccerBall.y < goalRect.y + goalRect.height) {
                        triggerGoalCelebration();
                    } else {
                        playSound('whistle'); // Missed the net
                    }
                    soccerBall = createSoccerBall(); // Reset ball to foreground
                    score = 0;
                    ballTrail = [];
                    return;
                }
            }

            if (ballTrail.length > 50) ballTrail.shift();
            drawBallTrail();

            // Scale the ball size based on Z depth
            var currentScale = Math.max(0.2, 1.0 - soccerBall.z);
            drawModernSoccerBall(soccerBall.x, soccerBall.y, settings.ballSize * currentScale, soccerBall.rotation);
        }

        function drawBallTrail() {
            for (let i = ballTrail.length - 1; i >= 0; i--) {
                let p = ballTrail[i];
                p.life--;
                if (p.life <= 0) {
                    ballTrail.splice(i, 1);
                } else {
                    let alpha = p.life / 25;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, (p.life / 20) * (settings.ballSize / 4) * (p.scale || 1), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100}, 0, ${alpha * 0.5})`;
                    ctx.fill();
                }
            }
        }

        function drawTouchIndicators() {
            motionPoints.forEach(p => {
                var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, settings.indicatorSize);
                grad.addColorStop(0, settings.indicatorColor + 'AA');
                grad.addColorStop(0.8, settings.indicatorColor + '55');
                grad.addColorStop(1, settings.indicatorColor + '00');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(p.x, p.y, settings.indicatorSize, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI); ctx.fill();
            });
        }

        function drawModernSoccerBall(x, y, r, rot) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke();
            var c = ['#E41E26', '#1E90FF', '#FFD700'];
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = c[i]; ctx.beginPath(); ctx.arc(r * 0.6, 0, r * 0.4, -Math.PI * 0.6, Math.PI * 0.6);
                ctx.rotate(Math.PI * 2 / 3); ctx.fill();
            }
            ctx.restore();
        }

        function createSoccerBall() {
            return {
                x: canvas.width / 2, y: canvas.height / 4,
                vx: (Math.random() - 0.5) * 10, vy: -5, z: 0,
                radius: settings.ballSize, rotation: 0, lastKicker: null, state: 'juggling'
            };
        }

        function trackMotion() {
            var mCanvas = document.createElement('canvas');
            var mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
            mCanvas.width = 64; mCanvas.height = 48;

            function scan() {
                if (!engineBooted) { setTimeout(scan, 100); return; }
                mCtx.drawImage(video, 0, 0, 64, 48);
                var cur = mCtx.getImageData(0, 0, 64, 48).data;
                motionPoints = [];
                
                if (lastFrame) {
                    let raw = [];
                    for (let i = 0; i < cur.length; i += 4) {
                        if (Math.abs(cur[i] - lastFrame[i]) > 45) {
                            var x = (1.0 - (((i / 4) % 64) / 64)) * canvas.width;
                            var y = (Math.floor(i / 4 / 64)) / 48 * canvas.height;
                            raw.push({ x, y });
                        }
                    }

                    if (raw.length > 0) {
                        let t = raw[0], b = raw[0], l = raw[0], r = raw[0];
                        raw.forEach(p => {
                            if (p.y < t.y) t = p; if (p.y > b.y) b = p;
                            if (p.x < l.x) l = p; if (p.x > r.x) r = p;
                        });
                        motionPoints = [t, b, l, r];

                        motionPoints.forEach(pt => {
                            if (!soccerBall) return;
                            var dx = soccerBall.x - pt.x;
                            var dy = soccerBall.y - pt.y;
                            
                            // Interaction Radius
                            if (Math.sqrt(dx * dx + dy * dy) < soccerBall.radius + 50) {
                                if (soccerBall.lastKicker !== pt) {
                                    if (soccerBall.state === 'juggling') {
                                        if (score >= 3) {
                                            // POWER STRIKE INTO BACKGROUND
                                            soccerBall.state = 'shooting';
                                            soccerBall.vy = -10; // Send upward arc
                                            soccerBall.vx = (canvas.width / 2 - soccerBall.x) * 0.05; // Curve slightly towards center net
                                            playSound('kick');
                                        } else {
                                            // Normal Juggle
                                            soccerBall.vy = -settings.kickPower * (1 - (dy / 200));
                                            soccerBall.vx = -dx * 0.25;
                                            score++;
                                            if (score > highScore) highScore = score;
                                            playSound('kick');
                                        }
                                    }
                                    soccerBall.lastKicker = pt;
                                }
                            } else {
                                soccerBall.lastKicker = null;
                            }
                        });
                    }
                }
                lastFrame = new Uint8ClampedArray(cur);
                setTimeout(scan, 50);
            }
            scan();
        }

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        function playSound(type) {
            if (!audioCtx) return;
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);

            if (type === 'kick') {
                o.frequency.setValueAtTime(150, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            } else if (type === 'whistle') {
                o.type = 'sine'; o.frequency.setValueAtTime(1200, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            } else if (type === 'bounce') {
                o.frequency.setValueAtTime(80, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            } else if (type === 'cheer') {
                g.gain.setValueAtTime(0, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.2);
                g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
                o = audioCtx.createBufferSource();
                var buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.5, audioCtx.sampleRate);
                var data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                o.buffer = buf; o.connect(g);
            }
            o.start(); o.stop(audioCtx.currentTime + 1.5);
        }

        function drawMirroredCamera() {
            ctx.save();
            ctx.globalAlpha = settings.cameraAlpha;
            ctx.filter = `blur(${settings.cameraBlur}px) contrast(1.2)`;
            ctx.scale(-1, 1); ctx.translate(-canvas.width, 0);
            if (video.readyState >= 3) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        document.addEventListener('keydown', e => { 
            if (e.key.toLowerCase() === 'f') { 
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().then(() => document.body.classList.add('fullscreen')); 
                else document.exitFullscreen().then(() => document.body.classList.remove('fullscreen'));
            }
        });
    </script>
</body>
</html>
