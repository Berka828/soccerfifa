<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>World Cup Keep-Up Challenge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* FIX: Robust hidden video element to prevent browser throttling */
        #webcam { transform: scaleX(-1); position:absolute; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events: none; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 16, 48, 0.9); z-index: 100; color: #fff; text-align: center;
        }
        button {
            padding: 20px 50px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
            background-color: #4CAF50; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0, 0.5); transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; transform: scale(1.05); }
        
        #error-msg {
            color: #ff4444; font-size: 1.2em; max-width: 600px; margin-top: 20px; display: none;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #ff4444;
        }

        .dg.ac { z-index: 50 !important; transition: opacity 0.3s; }
        body.fullscreen .dg.ac { opacity: 0; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 2px; font-size: 3em; font-weight: bold; margin-bottom: 10px;">KEEP-UP CHALLENGE</h1>
        <p style="color: #ddd; font-size: 1.2em; margin-bottom: 40px;">Use your legs and feet to keep the ball in the air!</p>
        <button id="startBtn" onclick="startApp()">START GAME</button>
        <div id="error-msg"></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        var video = document.getElementById('webcam');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var errorMsg = document.getElementById('error-msg');
        var startBtn = document.getElementById('startBtn');

        var soccerBall = null, motionPoints = [], playerSilhouette = [], lastFrame = null;
        var engineBooted = false, score = 0, highScore = 0;
