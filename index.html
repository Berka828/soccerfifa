<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Interactive Soccer Stadium</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { transform: scaleX(-1); display: none; }
        
        /* RESTORED: UI Overlay for Start Button */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 16, 48, 0.9); z-index: 100; color: #fff; text-align: center;
        }
        button {
            padding: 20px 50px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
            background-color: #4CAF50; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0, 0.5); transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; transform: scale(1.05); }
        
        .dg.ac { z-index: 50 !important; transition: opacity 0.3s; }
        body.fullscreen .dg.ac { opacity: 0; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <!-- RESTORED: Start Screen -->
    <div id="ui">
        <h1 style="letter-spacing: 2px; font-size: 3em; font-weight: bold; margin-bottom: 10px;">STADIUM KEEP-UP</h1>
        <p style="color: #ddd; font-size: 1.2em; margin-bottom: 40px;">Use your hands and feet to keep the soccer ball in the air!</p>
        <button onclick="startApp()">START GAME</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        var video = document.getElementById('webcam');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        var soccerBall = null;
        var motionPoints = [];
        var grassBlades = []; 
        var lastFrame = null;
        var engineBooted = false;

        var score = 0, highScore = 0;

        var settings = {
            gameSpeed: 1.0,      
            kickPower: 18,
            ballSize: 60,        
            gravity: 0.45,
            cameraAlpha: 0.15,
            cameraBlur: 6,
        };

        var audioCtx; 

        // --- RESTORED: User-triggered start sequence ---
        function startApp() {
            document.getElementById('ui').style.display = 'none'; // Hide the start screen
            initAudio(); // Safe to start audio now that the user clicked

            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
                video.play().catch(()=>{});
                var checkInterval = setInterval(() => {
                    if (video.videoWidth > 0 && !engineBooted) {
                        clearInterval(checkInterval);
                        engineBooted = true;
                        
                        // Setup settings menu
                        var gui = new dat.GUI();
                        var gameFolder = gui.addFolder('Game Settings');
                        gameFolder.add(settings, 'gameSpeed', 0.5, 2.0).name('Game Speed');
                        gameFolder.add(settings, 'kickPower', 10, 30).name('Kick Power');
                        gameFolder.add(settings, 'ballSize', 30, 100).name('Ball Size').onFinishChange(() => {
                            if(soccerBall) soccerBall.radius = settings.ballSize;
                        });
                        gameFolder.open();

                        var cameraFolder = gui.addFolder('Camera Mirror');
                        cameraFolder.add(settings, 'cameraAlpha', 0.0, 0.5).name('Visibility');
                        cameraFolder.add(settings, 'cameraBlur', 0, 20).name('Blur');

                        startExperience();
                    }
                }, 100);
            }).catch(err => { 
                console.error("Camera Error:", err); 
                alert("Camera access is required to play. Please allow camera permissions and reload.");
            });
        }

        function startExperience() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            var floorY = canvas.height * 0.9;
            for (let i = 0; i < canvas.width; i += 10) {
                grassBlades.push({ x: i, y: floorY, height: 20 + Math.random() * 15, bend: 0 });
            }

            soccerBall = createSoccerBall();
            trackMotion();
            gameLoop();
        }

        function drawModernSoccerBall(x, y, radius, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.stroke();

            var colors = ['#E41E26', '#1E90FF', '#FFD700']; 
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(radius * 0.6, 0, radius * 0.4, -Math.PI * 0.6, Math.PI * 0.6);
                ctx.rotate(Math.PI * 2 / 3);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawStadiumBackground() {
            var floorY = canvas.height * 0.9;

            var skyGrad = ctx.createLinearGradient(0, 0, 0, floorY);
            skyGrad.addColorStop(0, '#001030'); 
            skyGrad.addColorStop(1, '#003366'); 
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, floorY);

            for (let i = 0; i < 5; i++) {
                let lightX = (canvas.width / 4) * i;
                ctx.fillStyle = 'rgba(255, 255, 220, 0.8)';
                ctx.beginPath();
                ctx.ellipse(lightX, -20, 150, 40, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(20, 20, 30, 0.7)';
            ctx.fillRect(0, floorY - 150, canvas.width, 150);

            ctx.fillStyle = '#228B22'; 
            ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);

            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, floorY, 100, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        function drawInteractiveGrass() {
            var floorY = canvas.height * 0.9;
            ctx.strokeStyle = '#3CB371';
            ctx.lineWidth = 2;

            grassBlades.forEach(blade => {
                var bendAmount = 0;
                motionPoints.forEach(pt => {
                    let dist = Math.abs(pt.x - blade.x);
                    if (dist < 50 && pt.y > floorY - 50) {
                        bendAmount = (pt.x - blade.x) * 0.5;
                    }
                });
                blade.bend += (bendAmount - blade.bend) * 0.2;

                ctx.beginPath();
                ctx.moveTo(blade.x, blade.y);
                ctx.quadraticCurveTo(blade.x + blade.bend, blade.y - blade.height / 2, blade.x, blade.y - blade.height);
                ctx.stroke();
            });
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            drawStadiumBackground(); 
            drawInteractiveGrass(); 
            drawMirroredCamera();
            
            if (soccerBall) updateAndDrawBall();
            drawUI();
        }
        
        function updateAndDrawBall() {
            var floorY = canvas.height * 0.9;
            
            soccerBall.vy += settings.gravity * settings.gameSpeed;
            soccerBall.x += soccerBall.vx * settings.gameSpeed;
            soccerBall.y += soccerBall.vy * settings.gameSpeed;

            soccerBall.vx *= 0.98;
            soccerBall.vy *= 0.98;
            soccerBall.rotation += soccerBall.vx * 0.02 * settings.gameSpeed;

            if (soccerBall.x - settings.ballSize < 0 || soccerBall.x + settings.ballSize > canvas.width) {
                soccerBall.vx *= -0.9;
            }

            if (soccerBall.y + settings.ballSize > floorY) {
                soccerBall.y = floorY - settings.ballSize;
                soccerBall.vy *= -0.7;
                if (score > 0) playSound('whistle');
                score = 0;
            }

            drawModernSoccerBall(soccerBall.x, soccerBall.y, settings.ballSize, soccerBall.rotation);
        }

        function createSoccerBall() {
            return {
                x: canvas.width / 2, y: canvas.height / 4,
                vx: (Math.random() - 0.5) * 10, vy: -5,
                radius: settings.ballSize, rotation: 0, lastKicker: null
            };
        }

        function trackMotion() {
            var mCanvas = document.createElement('canvas');
            var mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
            mCanvas.width = 64; mCanvas.height = 48;

            function scan() {
                if (!engineBooted) { setTimeout(scan, 100); return; }
                mCtx.drawImage(video, 0, 0, 64, 48);
                var current = mCtx.getImageData(0, 0, 64, 48).data;
                motionPoints = [];
                
                if (lastFrame) {
                    let rawMotion = [];
                    for (let i = 0; i < current.length; i += 4) {
                        if (Math.abs(current[i] - lastFrame[i]) > 45) {
                            var x = (1.0 - (((i/4) % 64) / 64)) * canvas.width;
                            var y = (Math.floor(i/4/64))/48 * canvas.height;
                            rawMotion.push({ x, y });
                        }
                    }

                    if (rawMotion.length > 0) {
                        let topPt = rawMotion[0], bottomPt = rawMotion[0], leftPt = rawMotion[0], rightPt = rawMotion[0];
                        rawMotion.forEach(p => {
                            if (p.y < topPt.y) topPt = p; if (p.y > bottomPt.y) bottomPt = p;
                            if (p.x < leftPt.x) leftPt = p; if (p.x > rightPt.x) rightPt = p;
                        });
                        motionPoints = [topPt, bottomPt, leftPt, rightPt];

                        motionPoints.forEach(pt => {
                            if (!soccerBall) return;
                            var dx = soccerBall.x - pt.x;
                            var dy = soccerBall.y - pt.y;
                            if (Math.sqrt(dx*dx + dy*dy) < soccerBall.radius + 40) {
                                if (soccerBall.lastKicker !== pt) {
                                    soccerBall.vy = -settings.kickPower * (1 - (dy / 200));
                                    soccerBall.vx = -dx * 0.2;
                                    score++;
                                    if (score > highScore) highScore = score;
                                    playSound('kick');
                                    soccerBall.lastKicker = pt;
                                }
                            } else {
                                soccerBall.lastKicker = null;
                            }
                        });
                    }
                }
                lastFrame = new Uint8ClampedArray(current);
                setTimeout(scan, 50);
            }
            scan();
        }

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        function playSound(type) {
            if (!audioCtx) return;
            var osc = audioCtx.createOscillator();
            var gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

            if (type === 'kick') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            } else if (type === 'whistle') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function drawMirroredCamera() {
            ctx.save();
            ctx.globalAlpha = settings.cameraAlpha;
            ctx.filter = `blur(${settings.cameraBlur}px)`;
            ctx.scale(-1, 1); ctx.translate(-canvas.width, 0);
            if (video.readyState >= 3) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function drawUI() {
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 70px Arial, sans-serif';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 5;
            ctx.strokeText(score, canvas.width / 2, 100);
            ctx.fillText(score, canvas.width / 2, 100);

            ctx.textAlign = 'right';
            ctx.font = 'bold 30px Arial, sans-serif';
            ctx.strokeText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 70);
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 70);
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        document.addEventListener('keydown', e => { 
            if (e.key.toLowerCase() === 'f') { 
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().then(() => document.body.classList.add('fullscreen')); 
                else document.exitFullscreen().then(() => document.body.classList.remove('fullscreen'));
            }
        });

    </script>
</body>
</html>
