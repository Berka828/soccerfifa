<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ultimate Keep-Up Challenge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { transform: scaleX(-1); position:absolute; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 10, 30, 0.95); z-index: 100; color: #fff; text-align: center; }
        button { padding: 20px 50px; font-size: 24px; cursor: pointer; letter-spacing: 2px; background: linear-gradient(145deg, #5cb85c, #4cae4c); color: white; border: none; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0, 0.6); transition: all 0.3s ease; font-weight: bold; text-transform: uppercase; }
        button:hover { background: linear-gradient(145deg, #62c362, #57b957); transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0, 0.7); }
        .dg.ac { z-index: 50 !important; }
        body.fullscreen .dg.ac { opacity: 0; pointer-events: none; }
        
        /* NEW: On-screen error display */
        #game-error-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; /* Hidden by default */
            flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85);
            color: #fff; text-align: center; z-index: 200;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 3px; font-size: 4em; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 20px #fff;">ULTIMATE KEEP-UP</h1>
        <p style="color: #ddd; font-size: 1.4em; margin-bottom: 50px;">The definitive interactive soccer experience.</p>
        <button id="startBtn" onclick="startApp()">START</button>
    </div>
    
    <!-- NEW: In-game error overlay -->
    <div id="game-error-overlay">
        <h2 style="color: #ff6b6b;">CAMERA ERROR</h2>
        <p id="game-error-message" style="font-size: 1.2em; max-width: 600px;"></p>
        <button onclick="startCamera()">RETRY CAMERA</button>
        <p style="margin-top: 30px; color: #ccc;">(You can still play using the mouse)</p>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>
    <script>
        var video = document.getElementById('webcam'), canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
        var soccerBall = null, motionPoints = [], playerSilhouette = [], lastFrame = null;
        var engineBooted = false, score = 0, highScore = 0, combo = 0;
        var audioCtx, currentDifficulty = 1.0;
        var grass3D = [], popupMessages = [];
        var backgroundImage = new Image(), backgroundLoaded = false;
        var cameraActive = false; // NEW: Flag to track camera status
        var mousePos = null; // NEW: For mouse fallback

        var defaultSettings = { gameMode: 'Challenge', kickPower: 18, ballSize: 60, floorLevel: 0.9, soundEnabled: true, cameraAlpha: 0.2, cameraBlur: 3, indicatorColor: '#00FFFF', showPlayerForm: true, showExtremities: true, ballTexture: 'Modern' };
        var settings = JSON.parse(localStorage.getItem('ultimateSoccerSettings')) || { ...defaultSettings };
        
        function startApp() {
            document.getElementById('ui').style.display = 'none';
            initAudio();
            startExperience(); // Start the game loop immediately
            startCamera(); // Attempt to start the camera
        }

        function startCamera() {
            document.getElementById('game-error-overlay').style.display = 'none';
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showInGameError("Your browser doesn't support webcams.");
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } }).then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => video.play().then(() => {
                    cameraActive = true;
                    if (!lastFrame) { trackMotion(); } // Start motion tracking only once
                });
            }).catch(err => {
                cameraActive = false;
                console.error("Camera Error:", err);
                if (err.name === "NotAllowedError") showInGameError("Camera permission was denied. Please allow camera access in your browser settings and click retry.");
                else if (err.name === "NotReadableError" || err.name === "OverconstrainedError") showInGameError("Camera is in use by another application (Zoom, Teams, etc). Please close it and click retry.");
                else showInGameError("An unknown camera error occurred: " + err.name);
            });
        }
        
        function showInGameError(msg) {
            document.getElementById('game-error-message').innerHTML = msg;
            document.getElementById('game-error-overlay').style.display = 'flex';
        }

        function setupGUI() { /* This function is unchanged */
            var gui = new dat.GUI();
            var gameFolder = gui.addFolder('Gameplay');
            gameFolder.add(settings, 'gameMode', ['Challenge', 'Zen', 'Frenzy']).name('Game Mode').onChange(resetGame);
            gameFolder.add(settings, 'kickPower', 10, 30).name('Kick Power');
            gameFolder.add(settings, 'ballSize', 40, 120).name('Ball Size').onFinishChange(() => { if(soccerBall) soccerBall.radius = settings.ballSize; });
            gameFolder.add(settings, 'floorLevel', 0.5, 1.0).name('Floor Level').onChange(resizeCanvas);
            gameFolder.add(settings, 'soundEnabled').name('Sound ON/OFF');
            gameFolder.open();
            var visualsFolder = gui.addFolder('Visuals');
            visualsFolder.add(settings, 'ballTexture', ['Modern', 'Black & White']).name('Ball Texture');
            visualsFolder.add(settings, 'showPlayerForm').name('Show Player Form');
            visualsFolder.add(settings, 'showExtremities').name('Show Kick Points');
            visualsFolder.addColor(settings, 'indicatorColor').name('Form Color');
            visualsFolder.open();
            var persistence = { saveSettings: () => { localStorage.setItem('ultimateSoccerSettings', JSON.stringify(settings)); addPopup("Settings Saved!"); }, resetToDefaults: () => { if (confirm('Reset all settings?')) { localStorage.removeItem('ultimateSoccerSettings'); window.location.reload(); } } };
            var saveFolder = gui.addFolder('Save & Reset');
            saveFolder.add(persistence, 'saveSettings').name('Save All Settings');
            saveFolder.add(persistence, 'resetToDefaults').name('Reset to Defaults');
        }

        function startExperience() {
            if (engineBooted) return;
            engineBooted = true;
            
            setupGUI(); // Setup the menu
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Mouse fallback controls
            canvas.addEventListener('mousemove', e => { mousePos = {x: e.clientX, y: e.clientY}; });
            canvas.addEventListener('mouseout', () => { mousePos = null; });

            backgroundImage.src = 'ChatGPT Image May 16, 2026, 04_06_46 AM.png';
            backgroundImage.onload = () => { backgroundLoaded = true; };
            
            resetGame();
            gameLoop();
        }

        function resetGame() { score = 0; combo = 0; onFireSparks = []; popupMessages = []; soccerBall = createSoccerBall(); }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (backgroundLoaded) ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = '#228B22'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            
            draw3DGrass();
            if (cameraActive) {
                drawMirroredCamera();
                drawPlayerForm();
            } else if (mousePos) { // Draw mouse controller if camera is off
                motionPoints = [mousePos];
                drawPlayerForm();
            }
            if (soccerBall) updateAndDrawBall();
            drawBroadcastUI();
            drawPopups();
        }

        function updateAndDrawBall() { /* This function is unchanged */
            var floorY = canvas.height * settings.floorLevel;
            var centerX = canvas.width / 2;
            updateDifficulty();
            var currentGravity = 0.4 * currentDifficulty;
            soccerBall.vy += currentGravity;
            var funnelStrength = 0.05;
            soccerBall.vx += (centerX - soccerBall.x) * funnelStrength * 0.01;
            soccerBall.x += soccerBall.vx; soccerBall.y += soccerBall.vy;
            soccerBall.vx *= 0.98; soccerBall.vy *= 0.99;
            soccerBall.rotation.y += soccerBall.vx * 0.02;
            soccerBall.rotation.x -= soccerBall.vy * 0.02;
            if (soccerBall.x - settings.ballSize < 0 || soccerBall.x + settings.ballSize > canvas.width) {
                soccerBall.vx *= -0.8;
                soccerBall.x = soccerBall.x < centerX ? settings.ballSize : canvas.width - settings.ballSize;
            }
            if (soccerBall.y + settings.ballSize > floorY) {
                soccerBall.y = floorY - settings.ballSize;
                soccerBall.vy *= -0.6;
                if (combo > 0) playSound('whistle');
                if (score > highScore) { highScore = score; addPopup("New High Score!", "#FFD700"); }
                score = 0; combo = 0;
            }
            if (combo >= 10) for(let i=0; i<3; i++) onFireSparks.push({x: soccerBall.x, y: soccerBall.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 30});
            drawOnFireSparks();
            draw3DSoccerBall(soccerBall.x, soccerBall.y, settings.ballSize, soccerBall.rotation);
        }

        function trackMotion() {
            var mCanvas = document.createElement('canvas'), mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
            mCanvas.width = 64; mCanvas.height = 48;
            function scan() {
                // Only run scan if camera is active
                if (!engineBooted || !cameraActive) { setTimeout(scan, 200); return; }
                mCtx.drawImage(video, 0, 0, 64, 48);
                var cur = mCtx.getImageData(0, 0, 64, 48).data;
                motionPoints = []; playerSilhouette = [];
                if (lastFrame) {
                    let rawMotion = [];
                    for (let i = 0; i < cur.length; i += 8) { if (Math.abs(cur[i] - lastFrame[i]) > 40) { var x = (1.0 - (((i / 4) % 64) / 64)) * canvas.width, y = (Math.floor(i / 4 / 64)) / 48 * canvas.height; rawMotion.push({ x, y }); } }
                    playerSilhouette = rawMotion;
                    if (rawMotion.length > 0) {
                        let kickZonePoints = [];
                        let waistY = canvas.height * 0.45;
                        rawMotion.forEach(p => { if (p.y > waistY) kickZonePoints.push(p); });
                        if (kickZonePoints.length > 0) {
                            let lowestPt = kickZonePoints[0];
                            kickZonePoints.forEach(p => { if (p.y > lowestPt.y) lowestPt = p; });
                            motionPoints = [lowestPt];
                            var dx = soccerBall.x - lowestPt.x, dy = soccerBall.y - lowestPt.y;
                            if (Math.sqrt(dx * dx + dy * dy) < soccerBall.radius + 60) {
                                if (soccerBall.lastKicker !== lowestPt) {
                                    soccerBall.vy = -settings.kickPower; soccerBall.vx = -dx * 0.08;
                                    combo++; let scoreToAdd = combo >= 10 ? 10 : 1; score += scoreToAdd;
                                    if (score > highScore) highScore = score;
                                    playSound('kick'); soccerBall.lastKicker = lowestPt;
                                }
                            } else { soccerBall.lastKicker = null; }
                        }
                    }
                }
                lastFrame = new Uint8ClampedArray(cur);
                setTimeout(scan, 50);
            }
            scan();
        }

        // Mouse interaction logic (only triggers if camera is off)
        function checkMouseInteraction() {
            if (cameraActive || !mousePos || !soccerBall) return;
            var dx = soccerBall.x - mousePos.x, dy = soccerBall.y - mousePos.y;
            if (Math.sqrt(dx * dx + dy * dy) < soccerBall.radius) {
                soccerBall.vy = -settings.kickPower * 0.8; soccerBall.vx = -dx * 0.1;
                combo++; let scoreToAdd = combo >= 10 ? 10 : 1; score += scoreToAdd;
                if (score > highScore) highScore = score;
                playSound('kick');
            }
        }
        canvas.addEventListener('mousedown', checkMouseInteraction);

        // --- All other drawing/helper functions are unchanged and minified ---
        function updateDifficulty() { if (settings.gameMode === 'Challenge') { if (combo < 10) currentDifficulty = 1.0; else if (combo < 25) currentDifficulty = 1.2; else currentDifficulty = 1.4; } else if (settings.gameMode === 'Frenzy') { currentDifficulty = 1.5; } else { currentDifficulty = 0.7; } }
        function draw3DSoccerBall(x, y, r, rot) { ctx.save(); ctx.translate(x, y); let shadowY = (canvas.height * settings.floorLevel) - y; let shadowAlpha = Math.max(0, 0.4 - (shadowY / (canvas.height * 2))); ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`; ctx.beginPath(); ctx.ellipse(0, shadowY, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.rotate(rot.y); ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); let panels = (settings.ballTexture === 'Modern') ? [{color:'#E41E26', angle: 0}, {color:'#1E90FF', angle: 2.1}, {color:'#FFD700', angle: 4.2}] : [{color:'#000000', angle: 0}, {color:'#000000', angle: 1.25}, {color:'#000000', angle: 2.5}, {color:'#000000', angle: 3.75}, {color:'#000000', angle: 5.0}]; panels.forEach(panel => { ctx.fillStyle = panel.color; ctx.beginPath(); ctx.arc(r * 0.6, 0, r * 0.4, -Math.PI * 0.6, Math.PI * 0.6); ctx.rotate(panel.angle + rot.x); ctx.fill(); }); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.2, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        function drawBroadcastUI() { var c = combo >= 10 ? 10 : combo; var bW = Math.min(300, c * 30); ctx.save(); ctx.fillStyle = "rgba(0,20,50,0.8)"; ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(350, 20); ctx.lineTo(330, 90); ctx.lineTo(20, 90); ctx.closePath(); ctx.fill(); ctx.fillStyle = "#FFD700"; ctx.beginPath(); ctx.moveTo(25, 85); ctx.lineTo(25 + bW, 85); ctx.lineTo(25 + bW - 10, 75); ctx.lineTo(25, 75); ctx.closePath(); ctx.fill(); ctx.fillStyle = "white"; ctx.font = "bold 48px Arial,sans-serif"; ctx.textAlign = "left"; ctx.fillText(score, 35, 72); ctx.fillStyle = combo >= 10 ? "#FFD700" : "#fff"; ctx.font = "bold 20px Arial,sans-serif"; ctx.fillText("COMBO x" + combo, 200, 45); ctx.fillStyle = "white"; ctx.textAlign = "right"; ctx.font = "20px Arial,sans-serif"; ctx.fillText("HIGH SCORE: " + highScore, canvas.width - 40, 48); ctx.restore(); }
        function drawPlayerForm() { if (settings.showPlayerForm) { ctx.save(); ctx.fillStyle = settings.indicatorColor; playerSilhouette.forEach(p => { if (Math.random() > 0.4) { ctx.globalAlpha = Math.random() * 0.4; ctx.fillRect(p.x - 4, p.y - 4, 8, 8); } }); ctx.restore(); } if (settings.showExtremities) { motionPoints.forEach(p => { var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, settings.ballSize); g.addColorStop(0, "#FFFFFF"); g.addColorStop(1, settings.indicatorColor + "00"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, settings.ballSize, 0, 2 * Math.PI); ctx.fill(); }); } }
        function createSoccerBall() { return { x: canvas.width / 2, y: canvas.height / 4, vx: (Math.random() - 0.5) * 2, vy: -5, radius: settings.ballSize, rotation: { x: 0, y: 0, z: 0 }, lastKicker: null }; }
        function drawOnFireSparks() { for (let i = onFireSparks.length - 1; i >= 0; i--) { let p = onFireSparks[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) onFireSparks.splice(i, 1); else { ctx.fillStyle = `rgba(255,${180 + Math.random() * 75},0,${p.life / 30})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.life / 10, 0, Math.PI * 2); ctx.fill(); } } }
        function addPopup(text, color = "#fff") { popupMessages.push({ text: text, color: color, life: 120 }); }
        function drawPopups() { for (let i = popupMessages.length - 1; i >= 0; i--) { let p = popupMessages[i]; p.life--; if (p.life <= 0) popupMessages.splice(i, 1); else { ctx.save(); ctx.textAlign = "center"; ctx.font = "bold 48px Arial"; ctx.fillStyle = `rgba(255,255,255,${p.life / 120})`; ctx.strokeStyle = `rgba(0,0,0,${p.life / 120})`; ctx.lineWidth = 4; ctx.strokeText(p.text, canvas.width / 2, canvas.height / 2 - p.life); ctx.fillStyle = `rgba(${hexToRgb(p.color).r},${hexToRgb(p.color).g},${hexToRgb(p.color).b},${p.life / 120})`; ctx.fillText(p.text, canvas.width / 2, canvas.height / 2 - p.life); ctx.restore(); } } }
        function hexToRgb(hex) { var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return { r, g, b }; }
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) { if (!audioCtx || !settings.soundEnabled) return; var o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.2, audioCtx.currentTime); if (type === 'kick') { o.frequency.setValueAtTime(150 + combo * 5, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); } else if (type === 'whistle') { o.type = 'sine'; o.frequency.setValueAtTime(1200, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); } else if (type === 'bounce') { o.frequency.setValueAtTime(80, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); } o.start(); o.stop(audioCtx.currentTime + 0.4); }
        function drawMirroredCamera() { ctx.save(); ctx.globalAlpha = settings.cameraAlpha; ctx.filter = `blur(${settings.cameraBlur}px) contrast(1.1) brightness(1.1)`; ctx.scale(-1, 1); ctx.translate(-canvas.width, 0); if (video.readyState >= 3) ctx.drawImage(video, 0, 0, canvas.width, canvas.height); ctx.restore(); }
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; grass3D = []; var fY = canvas.height * settings.floorLevel; for (let z = 0; z < 20; z++) { for (let x = 0; x < canvas.width; x += 20) { grass3D.push({ x: x + Math.random() * 10, y: fY, height: 40 - z * 1.5, z: z, bend: 0 }); } } }
        document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().then(() => document.body.classList.add('fullscreen')); else document.exitFullscreen().then(() => document.body.classList.remove('fullscreen')); } });
    </script>
</body>
</html>
