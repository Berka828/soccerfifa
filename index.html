<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ultimate Keep-Up Challenge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 10, 30, 0.95); z-index: 100; color: #fff; text-align: center; }
        button { padding: 20px 50px; font-size: 24px; cursor: pointer; letter-spacing: 2px; background: linear-gradient(145deg, #5cb85c, #4cae4c); color: white; border: none; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0, 0.6); transition: all 0.3s ease; font-weight: bold; }
        button:hover { background: linear-gradient(145deg, #62c362, #57b957); transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0, 0.7); }
        .dg.ac { z-index: 50 !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 3px; font-size: 4em; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 20px #fff;">ULTIMATE KEEP-UP</h1>
        <p style="color: #ddd; font-size: 1.4em; margin-bottom: 50px;">A true feet-only challenge!</p>
        <button id="startBtn" onclick="startApp()">START</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');

        let soccerBall = null, motionPoints = [], playerSilhouette = [], lastFrame = null;
        let engineBooted = false, score = 0, highScore = 0;
        
        let bgImage = new Image();
        let bgLoaded = false;
        bgImage.src = 'ChatGPT Image May 16, 2026, 04_06_46 AM.png';
        bgImage.onload = () => { bgLoaded = true; };

        const defaultSettings = {
            gameSpeed: 1.0, kickPower: 15, ballSize: 60, gravity: 0.4, 
            floorLevel: 0.9, soundEnabled: true, cameraAlpha: 0.3, cameraBlur: 3, 
            indicatorColor: '#00FFFF', indicatorSize: 50, funnelStrength: 0.05
        };
        let settings = JSON.parse(localStorage.getItem('soccerGameSettings')) || { ...defaultSettings };
        let audioCtx;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function startApp() {
            document.getElementById('ui').style.display = 'none';
            initAudio();
            
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play().then(() => {
                        if (!engineBooted) {
                            engineBooted = true;
                            setupGUI();
                            startExperience();
                        }
                    }).catch(err => alert("Video playback failed."));
                };
            }).catch(err => alert("Camera Error: " + err.message));
        }

        function setupGUI() {
            const gui = new dat.GUI();
            const gameFolder = gui.addFolder('Game Settings');
            gameFolder.add(settings, 'gameSpeed', 0.5, 2.0).name('Game Speed');
            gameFolder.add(settings, 'kickPower', 10, 25).name('Kick Power');
            gameFolder.add(settings, 'ballSize', 30, 100).name('Ball Size').onChange(v => { if(soccerBall) soccerBall.radius = v; });
            gameFolder.add(settings, 'floorLevel', 0.5, 1.0).name('Floor Level');
            gameFolder.add(settings, 'funnelStrength', 0.0, 0.2).name('Center Funnel');
            gameFolder.add(settings, 'soundEnabled').name('Sound ON/OFF');
            gameFolder.open();

            const playerFolder = gui.addFolder('Player Sensors');
            playerFolder.add(settings, 'cameraAlpha', 0.0, 1.0).name('Player Visibility');
            playerFolder.add(settings, 'cameraBlur', 0, 10).name('Player Blur');
            playerFolder.addColor(settings, 'indicatorColor').name('Sensor Color');
            playerFolder.add(settings, 'indicatorSize', 10, 80).name('Sensor Size');
            playerFolder.open();
            
            const saveFolder = gui.addFolder('Save & Reset');
            saveFolder.add({ save: () => { localStorage.setItem('soccerGameSettings', JSON.stringify(settings)); alert('Settings Saved!'); } }, 'save').name('Save Settings');
            saveFolder.add({ reset: () => { localStorage.removeItem('soccerGameSettings'); window.location.reload(); } }, 'reset').name('Reset Defaults');
        }

        function startExperience() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            soccerBall = { x: canvas.width/2, y: canvas.height/4, vx: 0, vy: 0, radius: settings.ballSize, rotation: 0, kickCooldown: 0 };
            trackMotion();
            gameLoop();
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (bgLoaded) { ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height); } 
            else { ctx.fillStyle = '#114411'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            
            drawMirroredCamera();
            drawPlayerForm();
            updateAndDrawBall();
            drawUI();
        }

        function drawMirroredCamera() {
            ctx.save();
            ctx.globalAlpha = settings.cameraAlpha;
            ctx.filter = `blur(${settings.cameraBlur}px) contrast(1.2)`;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function drawPlayerForm() {
            ctx.save();
            ctx.fillStyle = settings.indicatorColor;
            for (let i = 0; i < playerSilhouette.length; i++) {
                if (Math.random() > 0.4) {
                    ctx.globalAlpha = Math.random() * 0.5;
                    ctx.fillRect(playerSilhouette[i].x - 4, playerSilhouette[i].y - 4, 8, 8);
                }
            }
            ctx.restore();
            for (let i = 0; i < motionPoints.length; i++) {
                let p = motionPoints[i];
                let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, settings.indicatorSize);
                grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(1, settings.indicatorColor + '00');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(p.x, p.y, settings.indicatorSize, 0, 2 * Math.PI); ctx.fill();
            }
        }

        function updateAndDrawBall() {
            if (!soccerBall) return;
            if (soccerBall.kickCooldown > 0) soccerBall.kickCooldown--;
            let floorY = canvas.height * settings.floorLevel;
            let difficultyMultiplier = score < 10 ? 1.0 : (score < 25 ? 1.2 : 1.4);
            soccerBall.vy += settings.gravity * difficultyMultiplier * settings.gameSpeed;
            let distanceToCenter = (canvas.width / 2) - soccerBall.x;
            soccerBall.vx += distanceToCenter * settings.funnelStrength * 0.01 * settings.gameSpeed;
            soccerBall.x += soccerBall.vx * settings.gameSpeed;
            soccerBall.y += soccerBall.vy * settings.gameSpeed;
            soccerBall.vx *= 0.98; soccerBall.vy *= 0.99;
            soccerBall.rotation += soccerBall.vx * 0.02 * settings.gameSpeed;
            if (soccerBall.x - soccerBall.radius < 0 || soccerBall.x + soccerBall.radius > canvas.width) {
                soccerBall.vx *= -0.8;
                soccerBall.x = Math.max(soccerBall.radius, Math.min(canvas.width - soccerBall.radius, soccerBall.x));
                playSound('bounce');
            }
            if (soccerBall.y + soccerBall.radius > floorY) {
                soccerBall.y = floorY - soccerBall.radius;
                soccerBall.vy *= -0.6;
                if (score > 0) playSound('whistle');
                if (score > highScore) highScore = score;
                score = 0;
            }
            ctx.save(); ctx.translate(soccerBall.x, soccerBall.y); ctx.rotate(soccerBall.rotation);
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(0, 0, soccerBall.radius, 0, 2 * Math.PI); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
            const colors = ['#E41E26', '#1E90FF', '#FFD700'];
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(soccerBall.radius * 0.6, 0, soccerBall.radius * 0.4, -Math.PI * 0.6, Math.PI * 0.6);
                ctx.rotate(Math.PI * 2 / 3);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawUI() {
            ctx.fillStyle = 'rgba(0, 20, 50, 0.8)';
            ctx.fillRect(20, 20, 280, 60);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(canvas.width - 280, 20, 260, 40);
            ctx.fillStyle = 'white'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'left';
            ctx.fillText(score, 40, 65);
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial';
            ctx.fillText('KICKS', 100, 62);
            ctx.fillStyle = 'white'; ctx.textAlign = 'right'; ctx.font = '20px Arial';
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 48);
        }

        function playSound(type) {
            if (!audioCtx || !settings.soundEnabled) return;
            let o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if (type === 'kick') {
                o.frequency.setValueAtTime(150, audioCtx.currentTime);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                o.start(); o.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'whistle') {
                o.type = 'sine'; o.frequency.setValueAtTime(1200, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                o.start(); o.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'bounce') {
                o.frequency.setValueAtTime(80, audioCtx.currentTime);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                o.start(); o.stop(audioCtx.currentTime + 0.2);
            }
        }

        function trackMotion() {
            const mC = document.createElement('canvas');
            const mCtx = mC.getContext('2d', { willReadFrequently: true });
            mC.width = 64; mC.height = 48;
            
            function scan() {
                if (!engineBooted) { setTimeout(scan, 100); return; }
                mCtx.drawImage(video, 0, 0, 64, 48);
                let cur = mCtx.getImageData(0, 0, 64, 48).data;
                motionPoints = [];
                playerSilhouette = [];
                if (lastFrame) {
                    let rawMotion = [];
                    for (let i = 0; i < cur.length; i += 4) {
                        if (Math.abs(cur[i] - lastFrame[i]) > 35) { // Lowered sensitivity
                            let px = (i / 4) % 64;
                            let py = Math.floor((i / 4) / 64);
                            let x = (1.0 - (px / 64)) * canvas.width;
                            let y = (py / 48) * canvas.height;
                            rawMotion.push({ x, y });
                        }
                    }
                    playerSilhouette = rawMotion;

                    //--- DEFINITIVE LOWEST POINT LOGIC ---
                    if (rawMotion.length > 0) {
                        // Find the single lowest point of all motion on the screen.
                        let lowestPt = rawMotion.reduce((prev, curr) => (curr.y > prev.y ? curr : prev));
                        
                        // This is the ONLY active kick point.
                        motionPoints = [lowestPt]; 
                        
                        if (soccerBall && soccerBall.kickCooldown <= 0) {
                            let dx = soccerBall.x - lowestPt.x;
                            let dy = soccerBall.y - lowestPt.y;
                            
                            if (Math.sqrt(dx * dx + dy * dy) < soccerBall.radius + settings.indicatorSize) {
                                soccerBall.vy = -settings.kickPower;
                                // De-explosive horizontal kick
                                soccerBall.vx += -dx * 0.05; 
                                score++;
                                if (score > highScore) highScore = score;
                                playSound('kick');
                                soccerBall.kickCooldown = 10;
                            }
                        }
                    }
                }
                lastFrame = new Uint8ClampedArray(cur);
                setTimeout(scan, 50);
            }
            scan();
        }
        document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }});
    </script>
</body>
</html>
