<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Keep-Up Challenge - Knee & Foot Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 16, 48, 0.9); z-index: 100; color: #fff; text-align: center; }
        button { padding: 20px 50px; font-size: 24px; cursor: pointer; letter-spacing: 1px; background-color: #4CAF50; color: white; border: none; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0, 0.5); transition: 0.3s; font-weight: bold; }
        button:hover { background-color: #45a049; transform: scale(1.05); }
        #error-msg { color: #ff4444; font-size: 1.2em; max-width: 600px; margin-top: 20px; display: none; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #ff4444; }
        .dg.ac { z-index: 50 !important; }
        #loading-status { margin-top: 15px; color: #aaa; font-style: italic; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 2px; font-size: 3em; font-weight: bold; margin-bottom: 10px;">KEEP-UP CHALLENGE</h1>
        <p style="color: #ddd; font-size: 1.2em; margin-bottom: 40px;">Use only your knees and feet to keep the ball in the air!</p>
        <button id="startBtn" onclick="startApp()">START GAME</button>
        <div id="loading-status"></div>
        <div id="error-msg"></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const errorMsg = document.getElementById('error-msg');
        const startBtn = document.getElementById('startBtn');
        const loadingStatus = document.getElementById('loading-status');

        let soccerBall = null, trackingPoints = [], activeJoints = [];
        let engineBooted = false, score = 0, highScore = 0;
        let poseTracker = null, cameraUtils = null;
        
        let bgImage = new Image();
        let bgLoaded = false;
        bgImage.src = 'BxCMFifa bg.png'; // Updated to use the updated layout asset background
        bgImage.onload = () => { bgLoaded = true; };

        const defaultSettings = {
            gameSpeed: 1.0, kickPower: 16, ballSize: 60, gravity: 0.4, 
            floorLevel: 0.9, soundEnabled: true, cameraAlpha: 0.3, cameraBlur: 0, 
            indicatorColor: '#00FFFF', indicatorSize: 35, detectionConfidence: 0.5
        };
        let settings = JSON.parse(localStorage.getItem('soccerGameSettings')) || { ...defaultSettings };
        let audioCtx;

        function showError(msg) { errorMsg.innerHTML = msg; errorMsg.style.display = 'block'; startBtn.innerText = "TRY AGAIN"; loadingStatus.innerText = "";}
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function startApp() {
            errorMsg.style.display = 'none';
            startBtn.style.display = 'none';
            loadingStatus.innerText = "Initializing AI Pose Tracking (this may take a few seconds)...";
            initAudio();
            
            // Setup MediaPipe Pose
            poseTracker = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            poseTracker.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: settings.detectionConfidence,
                minTrackingConfidence: settings.detectionConfidence
            });

            poseTracker.onResults(onPoseResults);

            // Access Webcam and initialize MediaPipe Camera Toolkit
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                cameraUtils = new Camera(video, {
                    onFrame: async () => {
                        await poseTracker.send({ image: video });
                    },
                    width: 640,
                    height: 480
                });
                cameraUtils.start().then(() => {
                    if (!engineBooted) {
                        engineBooted = true;
                        document.getElementById('ui').style.display = 'none';
                        setupGUI();
                        startExperience();
                    }
                }).catch(err => showError("Camera runtime pipeline failure."));
            }).catch(err => showError("Camera Access Error: " + err.message));
        }

        function setupGUI() {
            const gui = new dat.GUI();
            const gameFolder = gui.addFolder('Game Settings');
            gameFolder.add(settings, 'gameSpeed', 0.5, 2.0).name('Game Speed');
            gameFolder.add(settings, 'kickPower', 10, 25).name('Kick Power');
            gameFolder.add(settings, 'ballSize', 30, 100).name('Ball Size').onChange(v => { if(soccerBall) soccerBall.radius = v; });
            gameFolder.add(settings, 'floorLevel', 0.5, 1.0).name('Floor Level');
            gameFolder.add(settings, 'soundEnabled').name('Sound ON/OFF');
            gameFolder.open();

            const playerFolder = gui.addFolder('AI Sensor Settings');
            playerFolder.add(settings, 'cameraAlpha', 0.0, 1.0).name('Player Visibility');
            playerFolder.add(settings, 'cameraBlur', 0, 10).name('Player Blur');
            playerFolder.addColor(settings, 'indicatorColor').name('Joint Sensor Color');
            playerFolder.add(settings, 'indicatorSize', 15, 60).name('Sensor Size');
            playerFolder.add(settings, 'detectionConfidence', 0.3, 0.9).name('AI Sensitivity').onChange(v => {
                if(poseTracker) poseTracker.setOptions({ minDetectionConfidence: v, minTrackingConfidence: v });
            });
            playerFolder.open();
            
            const saveFolder = gui.addFolder('Save & Reset');
            saveFolder.add({ save: () => { localStorage.setItem('soccerGameSettings', JSON.stringify(settings)); alert('Settings Saved!'); } }, 'save').name('Save Settings');
            saveFolder.add({ reset: () => { localStorage.removeItem('soccerGameSettings'); window.location.reload(); } }, 'reset').name('Reset Defaults');
        }

        function startExperience() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            soccerBall = { x: canvas.width/2, y: canvas.height/4, vx: 0, vy: 0, radius: settings.ballSize, rotation: 0, kickCooldown: 0 };
            gameLoop();
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        // Core MediaPipe callback executing frame calculations
        function onPoseResults(results) {
            trackingPoints = [];
            if (!results.poseLandmarks) return;

            // Target Key Indices from MediaPipe Pose Model Architecture:
            // 25: Left Knee, 26: Right Knee, 27: Left Ankle, 28: Right Ankle, 31: Left Foot Index, 32: Right Foot Index
            const targetJoints = [25, 26, 27, 28, 31, 32];

            targetJoints.forEach(index => {
                let landmark = results.poseLandmarks[index];
                // Only use points with a strong tracking confidence score
                if (landmark && landmark.visibility > 0.5) {
                    // Mirroring the coordinate system path so it mirrors natural human physical movement
                    let x = (1.0 - landmark.x) * canvas.width;
                    let y = landmark.y * canvas.height;
                    trackingPoints.push({ x, y });
                }
            });

            // Handle real-time physical interactions with the tracked joints
            if (soccerBall && soccerBall.kickCooldown <= 0) {
                for (let i = 0; i < trackingPoints.length; i++) {
                    let joint = trackingPoints[i];
                    let dx = soccerBall.x - joint.x;
                    let dy = soccerBall.y - joint.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    // Core Collision threshold check (Ball boundary meeting Joint boundary)
                    if (distance < soccerBall.radius + settings.indicatorSize) {
                        soccerBall.vy = -settings.kickPower;
                        soccerBall.vx = dx * 0.15; // Drives contextual vector tracking based on where contact hit
                        score++;
                        if (score > highScore) highScore = score;
                        playSound('kick');
                        soccerBall.kickCooldown = 8; // Cooldown frames to prevent bounce loop artifacts
                        break;
                    }
                }
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (bgLoaded) { ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height); } 
            else { ctx.fillStyle = '#114411'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            
            drawMirroredCamera();
            drawJointSensors();
            updateAndDrawBall();
            drawUI();
        }

        function drawMirroredCamera() {
            ctx.save();
            ctx.globalAlpha = settings.cameraAlpha;
            if (settings.cameraBlur > 0) ctx.filter = `blur(${settings.cameraBlur}px) contrast(1.2)`;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function drawJointSensors() {
            for (let i = 0; i < trackingPoints.length; i++) {
                let p = trackingPoints[i];
                let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, settings.indicatorSize);
                grad.addColorStop(0, '#FFFFFF'); 
                grad.addColorStop(0.3, settings.indicatorColor); 
                grad.addColorStop(1, 'transparent');
                
                ctx.save();
                ctx.fillStyle = grad;
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, settings.indicatorSize, 0, 2 * Math.PI); 
                ctx.fill();
                ctx.restore();
            }
        }

        function updateAndDrawBall() {
            if (!soccerBall) return;
            if (soccerBall.kickCooldown > 0) soccerBall.kickCooldown--;
            
            let floorY = canvas.height * settings.floorLevel;
            let difficultyMultiplier = score < 10 ? 1.0 : (score < 25 ? 1.15 : 1.3);
            
            soccerBall.vy += settings.gravity * difficultyMultiplier * settings.gameSpeed;
            soccerBall.x += soccerBall.vx * settings.gameSpeed;
            soccerBall.y += soccerBall.vy * settings.gameSpeed;
            
            soccerBall.vx *= 0.98; 
            soccerBall.vy *= 0.99;
            soccerBall.rotation += soccerBall.vx * 0.02 * settings.gameSpeed;
            
            // Wall Collisions
            if (soccerBall.x - soccerBall.radius < 0 || soccerBall.x + soccerBall.radius > canvas.width) {
                soccerBall.vx *= -0.8;
                soccerBall.x = Math.max(soccerBall.radius, Math.min(canvas.width - soccerBall.radius, soccerBall.x));
                playSound('bounce');
            }
            
            // Floor Collision (Reset Score)
            if (soccerBall.y + soccerBall.radius > floorY) {
                soccerBall.y = floorY - soccerBall.radius;
                soccerBall.vy *= -0.5;
                if (score > 0) playSound('whistle');
                score = 0;
            }
            
            // Render Soccer Ball Graphic
            ctx.save(); 
            ctx.translate(soccerBall.x, soccerBall.y); 
            ctx.rotate(soccerBall.rotation);
            ctx.fillStyle = 'white';
            ctx.beginPath(); 
            ctx.arc(0, 0, soccerBall.radius, 0, 2 * Math.PI); 
            ctx.fill();
            ctx.strokeStyle = '#333'; 
            ctx.lineWidth = 2; 
            ctx.stroke();
            
            const colors = ['#E41E26', '#1E90FF', '#FFD700'];
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(soccerBall.radius * 0.6, 0, soccerBall.radius * 0.4, -Math.PI * 0.6, Math.PI * 0.6);
                ctx.rotate(Math.PI * 2 / 3);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawUI() {
            ctx.fillStyle = 'rgba(0, 20, 50, 0.8)';
            ctx.fillRect(20, 20, 280, 60);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(canvas.width - 280, 20, 260, 40);
            ctx.fillStyle = 'white'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'left';
            ctx.fillText(score, 40, 65);
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial';
            ctx.fillText('KICKS', 100, 62);
            ctx.fillStyle = 'white'; ctx.textAlign = 'right'; ctx.font = '20px Arial';
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 48);
        }

        function playSound(type) {
            if (!audioCtx || !settings.soundEnabled) return;
            let o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if (type === 'kick') {
                o.frequency.setValueAtTime(150, audioCtx.currentTime);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                o.start(); o.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'whistle') {
                o.type = 'sine'; o.frequency.setValueAtTime(1200, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                o.start(); o.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'bounce') {
                o.frequency.setValueAtTime(80, audioCtx.currentTime);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                o.start(); o.stop(audioCtx.currentTime + 0.2);
            }
        }

        document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }});
    </script>
</body>
</html>
