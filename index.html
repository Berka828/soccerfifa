<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BxCM Soccer Frenzy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

        body { margin: 0; overflow: hidden; background: #020813; font-family: 'Montserrat', sans-serif; }
        canvas { display: block; }

        /* UI Overlays */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        .bxcm-logo {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
        }

        /* BxCM Brand Colors */
        .c-y { color: #FFC107; }
        .c-o { color: #FF5722; }
        .c-m { color: #E91E63; }
        .c-g { color: #4CAF50; }
        .c-b { color: #2196F3; }

        #camera-settings {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: auto;
            max-width: 300px;
            margin-top: 15px;
        }

        select {
            padding: 8px;
            font-size: 1rem;
            border-radius: 4px;
            margin-top: 5px;
            width: 100%;
            background: #222;
            color: white;
            border: 1px solid #555;
        }

        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 240px;
            height: 180px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            overflow: hidden;
            transform: scaleX(-1);
            opacity: 0.8;
            z-index: 10;
            display: none; 
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* Game Specific UI */
        #hud {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            gap: 40px;
            z-index: 5;
        }

        .hud-box {
            background: rgba(0,0,0,0.6);
            padding: 15px 30px;
            border-radius: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hud-label {
            font-size: 1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud-value {
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        #timer-value { color: #FFC107; }

        #center-message {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0px 10px 30px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 20;
            text-transform: uppercase;
        }

        .pulse { animation: pulse 2s infinite; }

        #goal-alert {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 900;
            color: #E91E63; /* Magenta */
            text-shadow: 0 0 40px #E91E63, 0 0 10px #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.1s;
            font-style: italic;
        }

        .show-goal { animation: goalPop 1.5s forwards; }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        @keyframes goalPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box">
            <div class="hud-label">Time</div>
            <div class="hud-value" id="timer-value">60</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Goals</div>
            <div class="hud-value" id="score-value">0</div>
        </div>
    </div>

    <div id="center-message" class="pulse">Wave at a ball<br>to start!</div>
    <div id="goal-alert">GOAL!</div>

    <div id="ui-overlay">
        <div class="bxcm-logo">
            <span class="c-y">B</span><span class="c-o">R</span><span class="c-m">O</span><span class="c-g">N</span><span class="c-b">X</span> Children's Museum
        </div>
        <div id="camera-settings">
            <label for="camera-select">🎥 Select Sensor/Camera:</label>
            <select id="camera-select">
                <option value="">Loading cameras...</option>
            </select>
        </div>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <canvas id="motion-canvas" style="display:none;"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // --- Game Configuration & State ---
        const config = {
            motionThreshold: 40,    // Pixel color difference to count as motion
            requiredMotionMass: 6,  // How many pixels must change to trigger kick (reduces false positives)
            baseKickPower: 1.0,
            showWebcam: false,
            goFullscreen: () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            }
        };

        let gameState = 'waiting'; // waiting, playing, gameover
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;

        // BxCM Brand Colors
        const brandColors = [0xFFC107, 0xFF5722, 0xE91E63, 0x4CAF50, 0x2196F3]; 

        // --- Setup Admin GUI ---
        const gui = new GUI({ title: '⚙️ Museum Admin Panel' });
        const motionFolder = gui.addFolder('Motion Sensor Tuning');
        motionFolder.add(config, 'motionThreshold', 10, 100, 1).name('Pixel Sensitivity');
        motionFolder.add(config, 'requiredMotionMass', 1, 30, 1).name('Required Motion Mass');
        motionFolder.add(config, 'showWebcam').name('Show Webcam').onChange(v => {
            if (!document.fullscreenElement) document.getElementById('video-container').style.display = v ? 'block' : 'none';
        });
        gui.add(config, 'baseKickPower', 0.5, 2.0).name('Base Kick Power');
        gui.add(config, 'goFullscreen').name('Toggle Fullscreen (F)');

        // --- Setup Three.js Scene ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020813, 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12); 
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x020813, 1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const spotLight = new THREE.SpotLight(0xffffff, 200);
        spotLight.position.set(0, 15, 10);
        spotLight.angle = Math.PI / 3;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);

        // --- Environment ---
        // Sleek Field
        const fieldGeo = new THREE.PlaneGeometry(80, 80);
        const fieldMat = new THREE.MeshStandardMaterial({ 
            color: 0x051a2e, 
            roughness: 0.4,
            metalness: 0.1
        });
        const field = new THREE.Mesh(fieldGeo, fieldMat);
        field.rotation.x = -Math.PI / 2;
        field.position.y = -2;
        field.receiveShadow = true;
        scene.add(field);

        // Grid lines
        const gridHelper = new THREE.GridHelper(80, 40, 0x2196F3, 0x0a2745);
        gridHelper.position.y = -1.98;
        scene.add(gridHelper);

        // Goal Post
        const goalGroup = new THREE.Group();
        goalGroup.position.set(0, -2, -18);

        const postGeo = new THREE.CylinderGeometry(0.25, 0.25, 7);
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.2 });

        const leftPost = new THREE.Mesh(postGeo, postMat);
        leftPost.position.set(-8, 3.5, 0);
        leftPost.castShadow = true;
        goalGroup.add(leftPost);

        const rightPost = new THREE.Mesh(postGeo, postMat);
        rightPost.position.set(8, 3.5, 0);
        rightPost.castShadow = true;
        goalGroup.add(rightPost);

        const crossBarGeo = new THREE.CylinderGeometry(0.25, 0.25, 16.5);
        const crossBar = new THREE.Mesh(crossBarGeo, postMat);
        crossBar.rotation.z = Math.PI / 2;
        crossBar.position.set(0, 7, 0);
        crossBar.castShadow = true;
        goalGroup.add(crossBar);

        // Glowing Net Backing
        const netGeo = new THREE.PlaneGeometry(16, 7);
        const netMat = new THREE.MeshBasicMaterial({ color: 0x2196F3, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(0, 3.5, -2);
        goalGroup.add(net);
        scene.add(goalGroup);

        // --- The Soccer Balls (5 Kids/Positions) ---
        const balls = [];
        const startPositions = [-6, -3, 0, 3, 6]; // 5 lanes

        const ballGeo = new THREE.IcosahedronGeometry(0.7, 2); // Slightly low-poly cool look

        for(let i=0; i<5; i++) {
            const colorHex = brandColors[i % brandColors.length];
            const mat = new THREE.MeshStandardMaterial({ 
                color: colorHex,
                roughness: 0.2,
                metalness: 0.3,
                emissive: colorHex,
                emissiveIntensity: 0.2 // Slight glow
            });
            const mesh = new THREE.Mesh(ballGeo, mat);
            mesh.castShadow = true;

            const startPos = new THREE.Vector3(startPositions[i], -1.3, 5); 
            mesh.position.copy(startPos);
            scene.add(mesh);

            balls.push({
                mesh: mesh,
                startPos: startPos,
                vel: new THREE.Vector3(0,0,0),
                isKicked: false,
                lifeTime: 0,
                color: colorHex,
                motionCount: 0 // Track motion mass per frame
            });
        }

        // --- Sleek Particle Engine (Sparks/Trails) ---
        const sparks = [];
        // Use a stretched cylinder for a sleek streak effect
        const sparkGeo = new THREE.CylinderGeometry(0.04, 0.01, 1, 8);
        sparkGeo.rotateX(Math.PI / 2); // Align length with Z axis

        for(let i=0; i<150; i++){
            const mat = new THREE.MeshBasicMaterial({
                color: 0xffffff, 
                transparent: true, 
                blending: THREE.AdditiveBlending // Makes them glow
            });
            const p = new THREE.Mesh(sparkGeo, mat);
            p.visible = false;
            scene.add(p);
            sparks.push({ mesh: p, vel: new THREE.Vector3(), life: 0 });
        }

        function spawnSparks(position, colorHex, intensity) {
            let count = 0;
            // Scale number of sparks based on kick intensity
            const numSparks = Math.floor(10 + (intensity * 30)); 

            for(let i=0; i<sparks.length; i++) {
                if(sparks[i].life <= 0) {
                    const p = sparks[i];
                    p.mesh.position.copy(position);
                    p.mesh.material.color.setHex(colorHex);
                    p.mesh.visible = true;
                    p.life = 1.0 + (Math.random() * 0.5); // Random lifespan

                    // Explosion velocity outwards
                    const speed = 0.5 + (intensity * 0.8);
                    p.vel.set(
                        (Math.random()-0.5) * speed, 
                        (Math.random()*0.5 + 0.2) * speed, 
                        (Math.random()-0.5) * speed
                    );
                    count++;
                    if(count > numSparks) break; 
                }
            }
        }

        // --- Game Logic ---
        function startGame() {
            if(gameState === 'playing') return;
            gameState = 'playing';
            score = 0;
            timeLeft = 60;
            document.getElementById('score-value').innerText = score;
            document.getElementById('timer-value').innerText = timeLeft;
            
            const msg = document.getElementById('center-message');
            msg.style.display = 'none';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-value').innerText = timeLeft;
                if(timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameState = 'gameover';
            clearInterval(timerInterval);
            const msg = document.getElementById('center-message');
            msg.innerHTML = `TIME'S UP!<br><span style="font-size:2rem; color:#4CAF50;">Score: ${score}</span>`;
            msg.style.display = 'block';

            setTimeout(() => {
                gameState = 'waiting';
                msg.innerHTML = "Wave at a ball<br>to start!";
                balls.forEach(b => resetBall(b));
            }, 6000);
        }

        function triggerGoal(ball) {
            score++;
            document.getElementById('score-value').innerText = score;

            const alertEl = document.getElementById('goal-alert');
            // Match alert color to the ball
            alertEl.style.color = '#' + ball.color.toString(16).padStart(6, '0');
            alertEl.style.textShadow = `0 0 40px #${ball.color.toString(16).padStart(6, '0')}, 0 0 10px #fff`;
            
            alertEl.classList.remove('show-goal');
            void alertEl.offsetWidth; 
            alertEl.classList.add('show-goal');

            spawnSparks(ball.mesh.position, ball.color, 1.5); // Massive goal explosion
            resetBall(ball); // Immediately reset so they can kick again
        }

        function resetBall(b) {
            b.isKicked = false;
            b.lifeTime = 0;
            b.motionCount = 0;
            b.vel.set(0,0,0);
            b.mesh.position.copy(b.startPos);
        }

        // --- Camera & Motion Detection Setup ---
        const video = document.getElementById('webcam');
        const cameraSelect = document.getElementById('camera-select');
        const motionCanvas = document.getElementById('motion-canvas');
        const mCtx = motionCanvas.getContext('2d', { willReadFrequently: true });

        const GRID_W = 80; 
        const GRID_H = 60;
        motionCanvas.width = GRID_W;
        motionCanvas.height = GRID_H;

        let prevFrame = null;
        let currentStream = null;

        async function getCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

                if (videoDevices.length > 0) startStream(videoDevices[0].deviceId);
            } catch (err) {
                cameraSelect.innerHTML = '<option>Permission Denied/Error</option>';
            }
        }

        async function startStream(deviceId) {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: deviceId ? { deviceId: { exact: deviceId }, width: 640, height: 480 } : true 
                });
                video.srcObject = currentStream;
            } catch (err) { console.error(err); }
        }
        cameraSelect.addEventListener('change', (e) => startStream(e.target.value));

        // --- Core Motion Tracking ---
        function checkMotion() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
            if (gameState === 'gameover') return;

            mCtx.drawImage(video, 0, 0, GRID_W, GRID_H);
            const currentFrame = mCtx.getImageData(0, 0, GRID_W, GRID_H).data;

            if (prevFrame) {
                const activeBalls = balls.filter(b => !b.isKicked);
                // Reset motion counters
                activeBalls.forEach(b => b.motionCount = 0);

                const ballScreenData = activeBalls.map(b => {
                    return { ball: b, screenPos: b.mesh.position.clone().project(camera) };
                });

                if (ballScreenData.length > 0) {
                    for (let y = 0; y < GRID_H; y+=2) { 
                        for (let x = 0; x < GRID_W; x+=2) {
                            const i = (y * GRID_W + x) * 4;

                            const rDiff = Math.abs(currentFrame[i] - prevFrame[i]);
                            const gDiff = Math.abs(currentFrame[i+1] - prevFrame[i+1]);
                            const bDiff = Math.abs(currentFrame[i+2] - prevFrame[i+2]);

                            if (rDiff + gDiff + bDiff > config.motionThreshold) {
                                const normX = (1 - (x / GRID_W)) * 2 - 1; // Mirrored
                                const normY = -( (y / GRID_H) * 2 - 1 );

                                for (let data of ballScreenData) {
                                    const dist = Math.hypot(data.screenPos.x - normX, data.screenPos.y - normY);
                                    if (dist < 0.3) { 
                                        data.ball.motionCount++; // Accumulate motion mass
                                    }
                                }
                            }
                        }
                    }

                    // Evaluate accumulated motion to trigger kicks
                    for (let data of ballScreenData) {
                        if (data.ball.motionCount > config.requiredMotionMass) {
                            if (gameState === 'waiting') startGame();

                            data.ball.isKicked = true;

                            // Variable Impact: scale 0.5 to 1.5 based on how much motion occurred
                            let impactScale = Math.min(data.ball.motionCount / 15, 1.5);
                            impactScale = Math.max(impactScale, 0.5);

                            // Add a little randomness to X direction
                            const curveX = (Math.random() - 0.5) * 0.4;

                            data.ball.vel.set(
                                curveX, 
                                0.6 * config.baseKickPower * impactScale, // Arc up
                                -1.5 * config.baseKickPower * impactScale // Drive forward
                            );

                            spawnSparks(data.ball.mesh.position, data.ball.color, impactScale);
                        }
                    }
                }
            }
            prevFrame = new Uint8ClampedArray(currentFrame);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            checkMotion();

            // Physics for Balls
            for(let b of balls) {
                if(b.isKicked) {
                    b.lifeTime++;
                    b.vel.y -= 0.02; // Gravity
                    b.mesh.position.add(b.vel);
                    b.mesh.rotation.x -= b.vel.z * 0.5; // Spin visual

                    // Floor Bounce
                    if(b.mesh.position.y < -1.3 && b.vel.y < 0) {
                        b.mesh.position.y = -1.3;
                        b.vel.y *= -0.5; 
                        b.vel.x *= 0.9; 
                        b.vel.z *= 0.9;
                    }

                    // Goal Detection
                    if(b.mesh.position.z < -17 && b.mesh.position.z > -19) {
                        if(b.mesh.position.x > -8 && b.mesh.position.x < 8 && b.mesh.position.y < 7) {
                            triggerGoal(b);
                            continue; // Skip rest of loop since ball reset
                        }
                    }

                    // Reset if out of bounds or stopped
                    if(b.lifeTime > 200 || b.mesh.position.z < -25 || (Math.abs(b.vel.z) < 0.05 && b.mesh.position.y <= -1.2)) {
                        resetBall(b);
                    }
                }
            }

            // Update Sleek Sparks
            for(let p of sparks) {
                if(p.life > 0) {
                    p.life -= 0.03;
                    p.vel.y -= 0.01; // Slight gravity
                    p.mesh.position.add(p.vel);
                    
                    // Orient streak along velocity vector for sleek look
                    const target = p.mesh.position.clone().add(p.vel);
                    p.mesh.lookAt(target);

                    p.mesh.material.opacity = p.life;
                    if(p.life <= 0) p.mesh.visible = false;
                }
            }

            renderer.render(scene, camera);
        }

        // --- Fullscreen and UI Logic ---
        document.addEventListener('fullscreenchange', () => {
            const uiOverlay = document.getElementById('ui-overlay');
            const videoContainer = document.getElementById('video-container');

            if (document.fullscreenElement) {
                uiOverlay.style.display = 'none';
                videoContainer.style.display = 'none';
                gui.hide();
            } else {
                uiOverlay.style.display = 'block';
                if(config.showWebcam) videoContainer.style.display = 'block';
                gui.show();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') config.goFullscreen();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        getCameras();
        animate();
    </script>
</body>
</html>
