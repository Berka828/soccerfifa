<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>World Cup Keep-Up Challenge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { transform: scaleX(-1); position:absolute; top:0; left:0; width:1px; height:1px; opacity:0; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 16, 48, 0.9); z-index: 100; color: #fff; text-align: center;
        }
        button {
            padding: 20px 50px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
            background-color: #4CAF50; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0, 0.5); transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; transform: scale(1.05); }
        
        .dg.ac { z-index: 50 !important; transition: opacity 0.3s; }
        body.fullscreen .dg.ac { opacity: 0; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 2px; font-size: 3em; font-weight: bold; margin-bottom: 10px;">KEEP-UP CHALLENGE</h1>
        <p style="color: #ddd; font-size: 1.2em; margin-bottom: 40px;">Use your legs and feet to keep the ball in the air!</p>
        <button onclick="startApp()">START GAME</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        var video = document.getElementById('webcam');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        var soccerBall = null, motionPoints = [], playerSilhouette = [], lastFrame = null;
        var engineBooted = false, score = 0, highScore = 0;
        
        var backgroundImage = new Image();
        var backgroundLoaded = false;

        var defaultSettings = {
            gameSpeed: 1.0, kickPower: 16, ballSize: 60, gravity: 0.4, // Tweaked physics
            floorLevel: 0.9, soundEnabled: true, cameraAlpha: 0.2, cameraBlur: 3, 
            indicatorColor: '#00FFFF', indicatorSize: 40,
        };
        var settings = JSON.parse(localStorage.getItem('soccerGameSettings')) || { ...defaultSettings };

        var audioCtx;

        function startApp() {
            document.getElementById('ui').style.display = 'none';
            initAudio();
            startCamera();
            backgroundImage.src = 'ChatGPT Image May 16, 2026, 04_06_46 AM.png';
            backgroundImage.onload = () => { backgroundLoaded = true; };
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } }).then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play().then(() => {
                        if (!engineBooted) {
                            engineBooted = true;
                            setupGUI();
                            startExperience();
                        }
                    });
                };
            }).catch(err => { console.error("Camera Error:", err); });
        }
        
        function setupGUI() {
            var gui = new dat.GUI();
            var gameFolder = gui.addFolder('Game Settings');
            gameFolder.add(settings, 'gameSpeed', 0.5, 2.0).name('Game Speed');
            gameFolder.add(settings, 'kickPower', 10, 25).name('Kick Power');
            gameFolder.add(settings, 'ballSize', 30, 100).name('Ball Size').onFinishChange(() => { if(soccerBall) soccerBall.radius = settings.ballSize; });
            gameFolder.add(settings, 'floorLevel', 0.6, 1.0).name('Floor Level');
            gameFolder.add(settings, 'soundEnabled').name('Sound ON/OFF');
            gameFolder.open();

            var playerFolder = gui.addFolder('Player & Effects');
            playerFolder.add(settings, 'cameraAlpha', 0.0, 0.7).name('Video Visibility');
            playerFolder.add(settings, 'cameraBlur', 0, 20).name('Video Blur');
            playerFolder.addColor(settings, 'indicatorColor').name('Form Color');
            playerFolder.add(settings, 'indicatorSize', 10, 80).name('Extremity Size');
            playerFolder.open();
            
            var persistence = {
                saveSettings: function() { localStorage.setItem('soccerGameSettings', JSON.stringify(settings)); alert('Settings Saved!'); },
                resetToDefaults: function() { if (confirm('Reset all settings?')) { localStorage.removeItem('soccerGameSettings'); window.location.reload(); } }
            };
            var saveFolder = gui.addFolder('Save & Reset');
            saveFolder.add(persistence, 'saveSettings').name('Save Current Settings');
            saveFolder.add(persistence, 'resetToDefaults').name('Reset to Defaults');
        }

        function startExperience() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            soccerBall = createSoccerBall();
            trackMotion();
            gameLoop();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (backgroundLoaded) ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = '#114411'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            
            drawMirroredCamera();
            drawPlayerForm(); 
            if (soccerBall) updateAndDrawBall();
            drawBroadcastUI(); 
        }

        // --- CORE GAME LOGIC ---
        
        function updateAndDrawBall() {
            var floorY = canvas.height * settings.floorLevel;
            
            soccerBall.vy += settings.gravity * settings.gameSpeed;
            soccerBall.x += soccerBall.vx * settings.gameSpeed;
            soccerBall.y += soccerBall.vy * settings.gameSpeed;
            soccerBall.vx *= 0.99; // Less aggressive horizontal slowdown
            soccerBall.vy *= 0.99;
            soccerBall.rotation += soccerBall.vx * 0.02 * settings.gameSpeed;
            
            // Wall bounces
            if (soccerBall.x - settings.ballSize < 0 || soccerBall.x + settings.ballSize > canvas.width) {
                soccerBall.vx *= -0.8; // Softer wall bounce
                playSound('bounce');
            }

            // Floor bounce (Game Over)
            if (soccerBall.y + settings.ballSize > floorY) {
                soccerBall.y = floorY - settings.ballSize;
                soccerBall.vy *= -0.6; // Softer floor bounce
                if (score > 0) playSound('whistle');
                score = 0; // Reset score
            }

            drawModernSoccerBall(soccerBall.x, soccerBall.y, settings.ballSize, soccerBall.rotation);
        }

        function trackMotion() {
            var mCanvas = document.createElement('canvas');
            var mCtx = mC.getContext('2d', { willReadFrequently: true });
            mC.width = 64; mC.height = 48;

            function scan() {
                if (!engineBooted) { setTimeout(scan, 100); return; }
                mCtx.drawImage(video, 0, 0, 64, 48);
                var cur = mCtx.getImageData(0, 0, 64, 48).data;
                motionPoints = [];
                playerSilhouette = [];
                
                if (lastFrame) {
                    let rawMotion = [];
                    for (let i = 0; i < cur.length; i += 8) {
                        if (Math.abs(cur[i] - lastFrame[i]) > 40) {
                            var x = (1.0 - (((i / 4) % 64) / 64)) * canvas.width;
                            var y = (Math.floor(i / 4 / 64)) / 48 * canvas.height;
                            rawMotion.push({ x, y });
                        }
                    }
                    playerSilhouette = rawMotion;

                    // --- NEW: Interaction logic for KICK ZONE ONLY ---
                    if (rawMotion.length > 0) {
                        let kickZonePoints = [];
                        let upperBodyPoints = [];

                        rawMotion.forEach(p => {
                            // Divide points based on screen position
                            if (p.y > canvas.height * 0.5) { // Lower half of the screen
                                kickZonePoints.push(p);
                            } else {
                                upperBodyPoints.push(p);
                            }
                        });

                        // Only find the "lowest" point from the valid kick zone
                        if (kickZonePoints.length > 0) {
                            let lowestPt = kickZonePoints[0];
                            kickZonePoints.forEach(p => {
                                if (p.y > lowestPt.y) lowestPt = p;
                            });
                            motionPoints = [lowestPt]; // We only care about the lowest point now

                            // Interact ONLY with this lowest point
                            var dx = soccerBall.x - lowestPt.x;
                            var dy = soccerBall.y - lowestPt.y;
                            if (Math.sqrt(dx * dx + dy * dy) < soccerBall.radius + 60) { // Larger radius for feet
                                if (soccerBall.lastKicker !== lowestPt) {
                                    soccerBall.vy = -settings.kickPower; // Consistent kick height
                                    soccerBall.vx = -dx * 0.15; // Reduced horizontal influence
                                    score++;
                                    if (score > highScore) highScore = score;
                                    playSound('kick');
                                    soccerBall.lastKicker = lowestPt;
                                }
                            } else {
                                soccerBall.lastKicker = null;
                            }
                        }
                    }
                }
                lastFrame = new Uint8ClampedArray(cur);
                setTimeout(scan, 50);
            }
            scan();
        }

        // --- DRAWING & HELPER FUNCTIONS ---
        
        function drawBroadcastUI() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 20, 50, 0.8)';
            ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(320, 20); ctx.lineTo(300, 80); ctx.lineTo(20, 80); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath(); ctx.moveTo(canvas.width - 20, 20); ctx.lineTo(canvas.width - 280, 20); ctx.lineTo(canvas.width - 260, 60); ctx.lineTo(canvas.width - 20, 60); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = 'bold 36px Arial, sans-serif'; ctx.textAlign = 'left';
            ctx.fillText(score, 40, 65);
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial, sans-serif';
            ctx.fillText('KICKS', 100, 62);
            ctx.fillStyle = 'white'; ctx.textAlign = 'right'; ctx.font = '20px Arial, sans-serif';
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 48);
            ctx.restore();
        }

        function drawPlayerForm() {
            ctx.save();
            ctx.fillStyle = settings.indicatorColor;
            playerSilhouette.forEach(p => {
                if (Math.random() > 0.4) {
                    ctx.globalAlpha = Math.random() * 0.4;
                    ctx.fillRect(p.x - 4, p.y - 4, 8, 8); 
                }
            });
            ctx.restore();
            // Still draw the lowest point clearly
            motionPoints.forEach(p => {
                var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, settings.indicatorSize);
                grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(1, settings.indicatorColor + '00');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, settings.indicatorSize, 0, 2 * Math.PI); ctx.fill();
            });
        }
        
        function createSoccerBall() { return { x: canvas.width / 2, y: canvas.height / 4, vx: (Math.random() - 0.5) * 5, vy: -5, radius: settings.ballSize, rotation: 0, lastKicker: null }; }
        function drawModernSoccerBall(x, y, r, rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke(); var c = ['#E41E26', '#1E90FF', '#FFD700']; for (let i = 0; i < 3; i++) { ctx.fillStyle = c[i]; ctx.beginPath(); ctx.arc(r * 0.6, 0, r * 0.4, -Math.PI * 0.6, Math.PI * 0.6); ctx.rotate(Math.PI * 2 / 3); ctx.
