<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI World Cup Keep-Up</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* The camera feed must exist on the page to work, but we hide it visually */
        #webcam { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        
        /* Start Screen UI */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 15, 30, 0.95); z-index: 100; color: #fff; text-align: center;
        }
        
        h1 { letter-spacing: 3px; font-size: 4em; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        p { color: #ddd; font-size: 1.4em; margin-bottom: 40px; max-width: 600px; line-height: 1.5; }
        
        button {
            padding: 20px 60px; font-size: 24px; cursor: pointer; letter-spacing: 2px;
            background: linear-gradient(145deg, #4CAF50, #2E7D32); color: white;
            border: none; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0, 0.5);
            transition: all 0.3s ease; font-weight: bold;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0, 0.7); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #status-msg { margin-top: 20px; font-size: 1.2em; color: #FFD700; height: 30px; }
        .dg.ac { z-index: 50 !important; }
    </style>

    <!-- AI Body Tracking Library (Google MediaPipe) -->
    <script type="module">
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";
        window.PoseLandmarker = PoseLandmarker;
        window.FilesetResolver = FilesetResolver;
    </script>
    <!-- Settings Menu Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>AI KEEP-UP</h1>
        <p>Step back so the camera can see your whole body.<br>Use <strong>only your knees and feet</strong> to juggle the ball!</p>
        <button id="startBtn" onclick="initGame()">START GAME</button>
        <div id="status-msg"></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        const startBtn = document.getElementById('startBtn');

        // Game State
        let soccerBall = null;
        let score = 0, highScore = 0;
        let lastVideoTime = -1;
        let activeKickPoints = [];
        
        // Systems
        let poseLandmarker = null;
        let audioCtx = null;
        
        // Background Image Handling
        let bgImage = new Image();
        let bgLoaded = false;
        bgImage.src = 'background.png'; // Make sure this file is in your GitHub repo!
        bgImage.onload = () => { bgLoaded = true; };

        // Customizable Settings
        const settings = {
            gameSpeed: 1.0,
            kickPower: 22,
            ballSize: 60,
            gravity: 0.5,
            floorLevel: 0.9,
            cameraVisibility: 0.35,
            soundEnabled: true,
            showSensors: true,
            sensorColor: '#00FFFF'
        };

        function updateStatus(msg, isError = false) {
            statusMsg.style.color = isError ? '#ff4444' : '#FFD700';
            statusMsg.innerText = msg;
        }

        // --- STEP 1: INITIALIZATION ---
        async function initGame() {
            startBtn.disabled = true;
            
            // 1. Initialize Audio (Must happen on user click)
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // 2. Request Camera Permission
            updateStatus("Requesting camera access...");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { video.play(); resolve(); };
                });
            } catch (err) {
                updateStatus("Camera error. Please allow permissions.", true);
                startBtn.disabled = false;
                return;
            }

            // 3. Load the AI Model
            updateStatus("Loading AI Tracking Model... (This takes a moment)");
            try {
                const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
                poseLandmarker = await window.PoseLandmarker.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`, 
                        delegate: "GPU" 
                    },
                    runningMode: "VIDEO",
                    numPoses: 1
                });
            } catch (err) {
                updateStatus("Failed to load AI. Please check internet connection.", true);
                startBtn.disabled = false;
                return;
            }

            // 4. Start the Experience
            document.getElementById('ui').style.display = 'none';
            setupAdminMenu();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Spawn the ball
            soccerBall = { 
                x: canvas.width / 2, y: canvas.height / 4, 
                vx: 0, vy: 0, radius: settings.ballSize, rotation: 0, cooldown: 0 
            };
            
            // Start rendering loop
            requestAnimationFrame(gameLoop);
        }

        function setupAdminMenu() {
            if (typeof dat === 'undefined') return; // Skip if library didn't load
            const gui = new dat.GUI();
            gui.add(settings, 'gameSpeed', 0.5, 2.0).name('Game Speed');
            gui.add(settings, 'kickPower', 15, 40).name('Kick Power');
            gui.add(settings, 'ballSize', 30, 100).name('Ball Size').onChange(v => { if(soccerBall) soccerBall.radius = v; });
            gui.add(settings, 'gravity', 0.2, 1.0).name('Gravity');
            gui.add(settings, 'cameraVisibility', 0.0, 1.0).name('Camera Opacity');
            gui.add(settings, 'showSensors').name('Show AI Sensors');
            gui.addColor(settings, 'sensorColor').name('Sensor Color');
            gui.add(settings, 'soundEnabled').name('Sound ON/OFF');
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // --- STEP 2: GAME LOOP ---
        function gameLoop() {
            // 1. Run AI Tracking
            if (poseLandmarker && video.readyState >= 2) {
                let startTimeMs = performance.now();
                if (video.currentTime !== lastVideoTime) {
                    poseLandmarker.detectForVideo(video, startTimeMs, (result) => {
                        processAILandmarks(result.landmarks);
                    });
                    lastVideoTime = video.currentTime;
                }
            }

            // 2. Draw Environment
            if (bgLoaded) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                drawFallbackBackground();
            }

            // 3. Draw Camera Overlay & Sensors
            drawMirroredCamera();
            if (settings.showSensors) drawAISensors();

            // 4. Update and Draw Game Objects
            updateAndDrawBall();
            drawScoreboard();

            requestAnimationFrame(gameLoop);
        }

        // --- STEP 3: AI LOGIC (FEET & KNEES ONLY) ---
        function processAILandmarks(landmarks) {
            activeKickPoints = [];
            
            if (landmarks && landmarks.length > 0) {
                // MediaPipe Pose Indices: 
                // 25: L Knee, 26: R Knee, 27: L Ankle, 28: R Ankle, 31: L Foot, 32: R Foot
                const allowedIndices = [25, 26, 27, 28, 31, 32];
                
                allowedIndices.forEach(index => {
                    const mark = landmarks[0][index];
                    // Only use points the AI is highly confident it can see
                    if (mark && mark.visibility > 0.6) {
                        // Convert normalized coordinates (0 to 1) to canvas pixels
                        // Note: X is inverted (1 - x) because we mirror the camera horizontally
                        activeKickPoints.push({
                            x: (1 - mark.x) * canvas.width,
                            y: mark.y * canvas.height
                        });
                    }
                });

                checkBallCollision();
            }
        }

        function checkBallCollision() {
            if (!soccerBall || soccerBall.cooldown > 0) return;

            for (let i = 0; i < activeKickPoints.length; i++) {
                let pt = activeKickPoints[i];
                let dx = soccerBall.x - pt.x;
                let dy = soccerBall.y - pt.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                // If a valid foot/knee point intersects the ball's radius (+ padding)
                if (distance < soccerBall.radius + 40) {
                    
                    // Only allow a kick if the ball is falling downward or barely moving up
                    if (soccerBall.vy > -5) {
                        // Apply vertical kick power
                        soccerBall.vy = -settings.kickPower;
                        
                        // Apply slight horizontal nudge away from the foot to keep it centered
                        soccerBall.vx += (dx > 0 ? 1 : -1) * 3;
                        
                        score++;
                        if (score > highScore) highScore = score;
                        playSound('kick');
                        
                        // Set cooldown so a single swing doesn't trigger 5 kicks instantly
                        soccerBall.cooldown = 15;
                        break; // Exit loop after hitting one point
                    }
                }
            }
        }

        // --- STEP 4: PHYSICS & RENDERING ---
        function updateAndDrawBall() {
            if (soccerBall.cooldown > 0) soccerBall.cooldown--;
            
            let floorY = canvas.height * settings.floorLevel;
            
            // Physics
            soccerBall.vy += settings.gravity * settings.gameSpeed;
            
            // Gentle invisible funnel pushing ball toward center screen
            let centerPull = (canvas.width / 2) - soccerBall.x;
            soccerBall.vx += centerPull * 0.005 * settings.gameSpeed;

            soccerBall.x += soccerBall.vx * settings.gameSpeed;
            soccerBall.y += soccerBall.vy * settings.gameSpeed;
            
            // Friction/Drag
            soccerBall.vx *= 0.98;
            soccerBall.vy *= 0.99;
            soccerBall.rotation += soccerBall.vx * 0.03;

            // Wall bounces
            if (soccerBall.x - soccerBall.radius < 0 || soccerBall.x + soccerBall.radius > canvas.width) {
                soccerBall.vx *= -0.8;
                soccerBall.x = Math.max(soccerBall.radius, Math.min(canvas.width - soccerBall.radius, soccerBall.x));
                playSound('bounce');
            }

            // Floor drop (Game Over)
            if (soccerBall.y + soccerBall.radius > floorY) {
                soccerBall.y = floorY - soccerBall.radius;
                soccerBall.vy *= -0.6;
                if (score > 0) playSound('whistle');
                score = 0;
            }

            // Draw Ball
            ctx.save();
            ctx.translate(soccerBall.x, soccerBall.y);
            ctx.rotate(soccerBall.rotation);
            
            // Base white
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(0, 0, soccerBall.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.stroke();
            
            // Hexagon Pattern (simplified modern look)
            const colors = ['#E41E26', '#1E90FF', '#333333'];
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(soccerBall.radius * 0.5, 0, soccerBall.radius * 0.4, -Math.PI * 0.6, Math.PI * 0.6);
                ctx.rotate((Math.PI * 2) / 3);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawMirroredCamera() {
            ctx.save();
            ctx.globalAlpha = settings.cameraVisibility;
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function drawAISensors() {
            ctx.save();
            activeKickPoints.forEach(p => {
                // Draw glowing aura around tracked feet/knees
                let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 50);
                grad.addColorStop(0, '#FFFFFF');
                grad.addColorStop(0.3, settings.sensorColor + 'AA');
                grad.addColorStop(1, settings.sensorColor + '00');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 50, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawScoreboard() {
            ctx.fillStyle = 'rgba(0, 20, 50, 0.85)';
            ctx.fillRect(20, 20, 250, 80);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(canvas.width - 270, 20, 250, 50);

            ctx.fillStyle = 'white'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'left';
            ctx.fillText(score, 40, 75);
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial';
            ctx.fillText('KICKS', 110, 72);
            
            ctx.fillStyle = 'white'; ctx.textAlign = 'right'; ctx.font = '22px Arial';
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width - 40, 52);
        }

        function drawFallbackBackground() {
            let floorY = canvas.height * settings.floorLevel;
            // Sky
            let skyGrad = ctx.createLinearGradient(0, 0, 0, floorY);
            skyGrad.addColorStop(0, '#001030'); skyGrad.addColorStop(1, '#004488');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, floorY);
            // Grass
            ctx.fillStyle = '#1b5e20'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();
        }

        function playSound(type) {
            if (!audioCtx || !settings.soundEnabled) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'kick') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'whistle') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'bounce') {
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }
    </script>
</body>
</html>
